name: Atualizar projetos do README

on:
  schedule:
    - cron: "15 6 * * *"   # todo dia às 03:15 (horário de Brasília)
  workflow_dispatch:         # permite rodar na mão pela aba Actions
  push:
    branches: [main]
    paths:
      - projects.json
      - scripts/update-projects.mjs
      - .github/workflows/projects.yml

permissions:
  contents: write

concurrency:
  group: readme-projects
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar seção de projetos
        env:
          # Use um token pessoal (secret PROJECTS_TOKEN) para incluir repositórios
          # privados ou de organizações; sem ele, só os públicos aparecem.
          GITHUB_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/update-projects.mjs

      - name: Salvar README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Atualizar projetos do README"
          git pull --rebase origin main
          git push
